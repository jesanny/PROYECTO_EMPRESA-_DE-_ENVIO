<svg xmlns="http://www.w3.org/2000/svg" width="780" height="190" viewBox="0 0 780 190" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>Diagrama de clases: DemoEnvio, Envio, Paquete, Dimension</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="780" height="190" fill="#ffffff"/>
  <g fill="#eef3fb" stroke="#333" stroke-width="1.5">
    <rect x="15" y="55" width="120" height="50"/>
    <rect x="235" y="55" width="110" height="50"/>
    <rect x="435" y="55" width="110" height="50"/>
    <rect x="635" y="55" width="120" height="50"/>
  </g>
  <g fill="#111" text-anchor="middle" font-weight="bold">
    <text x="75" y="85">DemoEnvio</text>
    <text x="290" y="85">Envio</text>
    <text x="490" y="85">Paquete</text>
    <text x="695" y="85">Dimension</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="135" y1="80" x2="233" y2="80" stroke-dasharray="6 5" marker-end="url(#flecha)"/>
    <line x1="369" y1="80" x2="435" y2="80"/>
    <line x1="545" y1="80" x2="633" y2="80" stroke-dasharray="6 5" marker-end="url(#flecha)"/>
  </g>
  <!-- agregación: rombo vacío junto a Envio -->
  <path d="M345 80 L357 72 L369 80 L357 88 Z" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <g fill="#333" text-anchor="middle" font-size="13">
    <text x="184" y="68" font-style="italic">usa</text>
    <text x="402" y="68" font-style="italic">agrupa</text>
    <text x="589" y="68" font-style="italic">usa</text>
    <text x="357" y="108">1</text>
    <text x="423" y="100">0..3</text>
  </g>
  <g fill="#555" font-size="12">
    <text x="15" y="150">Línea discontinua con flecha: «usa» (una clase necesita a otra).</text>
    <text x="15" y="168">Rombo vacío: agregación (el todo agrupa partes que existen por sí solas).</text>
  </g>
</svg>
